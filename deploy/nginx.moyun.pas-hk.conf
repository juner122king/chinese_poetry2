# 墨韵 · pas-hk (Hong Kong)
# Domain: inkpoetry.xyz / www.inkpoetry.xyz → 47.239.28.41
#
# Live server file: /etc/nginx/conf.d/moyun.conf
# HTTPS is managed by Certbot (listen 443 + certificates under /etc/letsencrypt/).
# After fresh install without certs, use HTTP-only blocks then:
#   certbot --nginx -d inkpoetry.xyz -d www.inkpoetry.xyz --redirect
#
# Security group: open TCP 80 and TCP 443.

# --- Domain (Certbot will add ssl listen + rewrite HTTP→HTTPS) ---
server {
    listen 80;
    listen [::]:80;
    server_name inkpoetry.xyz www.inkpoetry.xyz;

    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_buffer_size 512k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 512k;
    }
}

# --- IP direct access stays HTTP-only ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.239.28.41 _;

    client_max_body_size 8m;
    large_client_header_buffers 4 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_buffer_size 512k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 512k;
    }
}
