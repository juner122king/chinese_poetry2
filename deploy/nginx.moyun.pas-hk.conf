# 墨韵 · pas-hk (Hong Kong) — install as /etc/nginx/conf.d/moyun.conf
# Domain: inkpoetry.xyz → A 47.239.28.41 (apex + www)

# Upstream app
# HTTP (default). After DNS is correct, run certbot --nginx -d inkpoetry.xyz -d www.inkpoetry.xyz

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name inkpoetry.xyz www.inkpoetry.xyz 47.239.28.41 _;

    client_max_body_size 8m;

    # ACME http-01 (certbot will use this path)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Next.js 16 may send a very large Link: preload header (many font files)
    proxy_buffer_size 512k;
    proxy_buffers 8 512k;
    proxy_busy_buffers_size 512k;
    large_client_header_buffers 4 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_buffer_size 512k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 512k;
    }
}
